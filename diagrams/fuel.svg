<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0b0b0d"/>
  <g font-family="Inter,Arial" font-size="14" fill="#9aa0a6" stroke="#9aa0a6" stroke-linecap="round" stroke-linejoin="round">

  <!-- Tank -->
  <rect x="40" y="360" width="140" height="80" rx="12" fill="none" stroke="#9aa0a6" id="tank"/>
  <text x="110" y="350" text-anchor="middle" fill="#9aa0a6">Fuel Tank</text>
  <!-- Pump icon -->
  <g id="pump" stroke="#ff3b3b" stroke-width="2">
    <circle cx="220" cy="380" r="20" fill="none"/>
    <path d="M220 360 v40 M200 380 h40" />
  </g>
  <text x="220" y="350" text-anchor="middle" fill="#ff3b3b">Pump</text>
  <path d="M180 380 h40" />
  <path d="M240 380 h60" />
  <!-- Filter -->
  <rect x="300" y="365" width="70" height="30" rx="6" fill="none" stroke="#ff3b3b" stroke-width="2" id="filter"/>
  <text x="335" y="360" text-anchor="middle" fill="#ff3b3b">Filter</text>
  <path d="M370 380 h60" />
  <!-- Rail / Injectors -->
  <rect x="430" y="340" width="150" height="80" rx="10" fill="none" stroke="#9aa0a6" id="injector"/>
  <path d="M450 360 v40 M475 360 v40 M500 360 v40 M525 360 v40" />
  <text x="505" y="335" text-anchor="middle" fill="#ff3b3b">Fuel Rail & Injectors</text>
  <path d="M580 380 h60" />
  <!-- ECM -->
  <rect x="640" y="300" width="270" height="140" rx="12" fill="none" stroke="#9aa0a6" id="ecm"/>
  <text x="775" y="290" text-anchor="middle" fill="#ff3b3b">ECM (Pulse Width)</text>
  <path d="M640 330 h-60" />
  <path d="M640 410 h-60" />

  </g>
</svg>