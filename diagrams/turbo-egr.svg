  <rect x="380" y="330" width="140" height="40" rx="8" fill="none" stroke="#ff3b3b" stroke-width="2" id="egr_cooler"/>
  <text x="450" y="325" text-anchor="middle" fill="#ff3b3b">EGR Cooler</text>
  <path d="M310 330 v-40 M450 330 v-40" />

  </g>
</svg>