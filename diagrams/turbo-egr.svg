  <text x="750" y="210" text-anchor="middle" fill="#ff3b3b">Intake Manifold</text>
  <!-- EGR branch -->
  <rect x="260" y="330" width="100" height="40" rx="8" fill="none" stroke="#ff3b3b" stroke-width="2" id="egr_valve"/>
