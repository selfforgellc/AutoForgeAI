<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0b0b0d"/>
  <g font-family="Inter,Arial" font-size="14" fill="#9aa0a6" stroke="#9aa0a6" stroke-linecap="round" stroke-linejoin="round">

  <g id="turbo" stroke="#ff3b3b" stroke-width="2">
    <circle cx="120" cy="260" r="36" fill="none"/>
    <path d="M120 224 v72 M84 260 h72" />
  </g>
  <text x="120" y="215" text-anchor="middle" fill="#ff3b3b">Turbocharger</text>
  <line x1="156" y1="260" x2="230" y2="260"/>
  <rect x="230" y="235" width="120" height="50" rx="8" fill="none" stroke="#ff3b3b" stroke-width="2" id="intercooler"/>
  <text x="290" y="230" text-anchor="middle" fill="#ff3b3b">Intercooler</text>
  <line x1="350" y1="260" x2="430" y2="260"/>
  <rect x="430" y="240" width="110" height="40" rx="8" fill="none" stroke="#ff3b3b" stroke-width="2" id="throttle"/>
