<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0b0b0d"/>
  <g font-family="Inter,Arial" font-size="14" fill="#9aa0a6" stroke="#9aa0a6" stroke-linecap="round" stroke-linejoin="round">

  <!-- Radiator fins -->
  <rect x="60" y="120" width="140" height="220" rx="10" fill="none" stroke="#ff3b3b" stroke-width="2" id="radiator"/>
  <path d="M70 140 h120 M70 160 h120 M70 180 h120 M70 200 h120 M70 220 h120 M70 240 h120 M70 260 h120" />
  <text x="130" y="110" text-anchor="middle" fill="#ff3b3b">Radiator</text>
  <!-- Thermostat -->
  <g id="thermostat" stroke="#ff3b3b" stroke-width="2">
    <circle cx="290" cy="180" r="22" fill="none"/>
    <path d="M278 180 h24" />
  </g>
  <text x="290" y="150" text-anchor="middle" fill="#ff3b3b">Thermostat</text>
  <!-- Water Pump (impeller) -->
  <g id="pump" stroke="#ff3b3b" stroke-width="2">
    <circle cx="400" cy="260" r="28" fill="none"/>
    <path d="M400 232 l12 12 l-12 12 l-12 -12 z" />
  </g>
  <text x="400" y="225" text-anchor="middle" fill="#ff3b3b">Water Pump</text>
  <!-- Engine block -->
  <rect x="500" y="160" width="220" height="160" rx="12" fill="none" stroke="#9aa0a6" id="engine"/>
  <path d="M520 180 h180 M520 205 h180 M520 230 h180 M520 255 h180" />
  <text x="610" y="150" text-anchor="middle" fill="#ff3b3b">Engine Block</text>
  <!-- Hoses -->
  <path d="M200 180 C230 180, 260 180, 268 180" />
  <path d="M312 180 C340 180, 360 200, 380 230" />
  <path d="M428 260 C460 260, 500 240, 500 220" />
  <path d="M500 280 C480 300, 430 320, 200 320" />
  <path d="M200 320 C160 320, 130 300, 130 280" />

  </g>
</svg>